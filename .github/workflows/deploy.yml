name: deploy

on:
  push:
    branches: [main]
    paths:
      - "conversation-generator-bb/**"
      - "infra/**"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # token OIDC para iniciar sesión en Azure sin secretos
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: conversation-generator-bb
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash scripts/deploy.sh
